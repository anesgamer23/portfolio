<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Snani Anes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #00ffe0;
      margin-bottom: 40px;
      font-size: 2.5rem;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 20px #00ffe0;
      border-color: #00ffe0;
    }

    .card h2 {
      margin-bottom: 15px;
      color: #00ffe0;
      font-size: 1.5rem;
    }

    .card a, .card span {
      color: #fff;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    .back-btn {
      margin-top: 50px;
      color: #ccc;
      text-decoration: underline;
      cursor: pointer;
    }

    .back-btn:hover {
      color: #00ffe0;
    }

    @media (max-width: 500px) {
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <h1>Mes Réseaux</h1>

  <div class="cards">
    <div class="card" onclick="window.open('https://wa.me/213600000000', '_blank')">
      <h2>📞 WhatsApp</h2>
      <a href="https://wa.me/213600000000" target="_blank">+213 xxxxxxxx</a>
    </div>

    <div class="card" onclick="window.open('https://t.me/Anes546', '_blank')">
      <h2>💬 Telegram</h2>
      <a href="https://t.me/Anes546" target="_blank">@Anes546</a>
    </div>

    <div class="card" onclick="window.open('https://discord.gg/RUzXTF84', '_blank')">
      <h2>🎮 Discord</h2>
      <span>@just____live23</span>
      <a href="https://discord.gg/RUzXTF84" target="_blank"></a>
    </div>
  </div>

  <div class="back-btn" onclick="window.location.href='index.html'">← Retour au portfolio</div>

</body>
</html>
